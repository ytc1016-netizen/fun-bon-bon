<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>fun bon bon 房報爆｜DEMO</title><style>*{box-sizing:border-box}body{margin:0;background:#07130f;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}main{height:100dvh;overflow:auto;scroll-snap-type:y mandatory}article{height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:end;justify-content:center;background:linear-gradient(150deg,#234b3c,#142920 60%,#08110e);overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}.shade{position:absolute;inset:0;background:linear-gradient(transparent 30%,#000c)}header{position:absolute;top:22px;left:20px;font-size:21px;font-weight:900}header span{color:#e9ce88}.tag{position:absolute;top:24px;right:15px;border:1px solid #ffffff80;background:#111a;padding:7px;border-radius:20px;font-size:11px}.content{position:relative;width:min(520px,100%);padding:20px 80px 90px 22px;text-shadow:0 2px 9px #000}h1{font-size:23px;line-height:1.4;margin:8px 0}.price{font-size:28px;color:#f5d48d;font-weight:850}.spec{line-height:1.8;color:#e5e9e4}.actions{position:absolute;right:14px;bottom:160px;display:grid;gap:18px}.actions button{border:1px solid #fff7;border-radius:50%;background:#173e2ecb;color:white;width:52px;height:52px;font-size:22px}.contact{background:#e9ce88;color:#183e2d;border:0;padding:12px 16px;border-radius:12px;font-weight:800;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#07130fe8;display:flex;justify-content:space-around;align-items:center;z-index:3}nav a{color:white;text-decoration:none;font-size:13px}small{display:block;margin-top:9px;color:#ddd} @media(min-width:700px){article{max-width:520px;margin:auto;border-inline:1px solid #385d49}nav{max-width:520px;margin:auto}}</style></head><body><main id="feed"></main><nav><a href="#feed">▶ 短影音</a><a href="#" onclick="alert('Demo：收藏功能下一階段驗收');return false">♡ 收藏</a><a href="studio.html">＋ 創作者</a></nav><script>const data=[['左營區','左營三房採光住宅','1,280 萬','3 房 2 廳 2 衛｜32 坪'],['三民區','三民兩房小家庭宅','898 萬','2 房 1 廳 1 衛｜23 坪'],['鳳山區','鳳山四房電梯華廈','1,580 萬','4 房 2 廳 2 衛｜41 坪']];const video='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';document.getElementById('feed').innerHTML=data.map((d,i)=>'<article><video muted playsinline loop preload="metadata" src="'+video+'"></video><div class="shade"></div><header>fun bon bon<span>.</span></header><div class="tag">DEMO｜非真實案件</div><div class="actions"><button onclick="this.style.color=\'#f87e91\'">♥</button><button onclick="navigator.share?navigator.share({title:document.title,url:location.href}):alert(location.href)">↗</button><button onclick="alert(\'Demo 尚未連結真實房仲\')">✉</button></div><div class="content"><div>'+d[0]+' · 示範案件 '+(i+1)+'</div><h1>'+d[1]+'</h1><div class="price">'+d[2]+'</div><div class="spec">'+d[3]+'</div><button class="contact" onclick="alert(\'DEMO：不會撥打虛構電話\')">聯絡創作者 →</button><small>目前播放開放授權的花卉測試影片，非房屋實拍、非 AI 製片；向上滑動切換案件。</small></div></article>').join('');const observer=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.6)v.play().catch(()=>{});else v.pause()}),{root:document.querySelector('main'),threshold:[0,.6]});document.querySelectorAll('article').forEach(a=>observer.observe(a));</script></body></html>
